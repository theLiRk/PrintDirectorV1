printers:
  - id: jotunn
    name: Jötunn
    type: klipper
    moonraker_url: http://192.168.1.100:7125
    obs:
      scene: Printer - Jötunn
  - id: a1
    name: A1
    type: bambu
    bambu_url: mqtt://192.168.1.120:8883
    access_code: "12345678"
    serial_number: "ABC123456"
    obs:
      scene: Printer - A1
  - id: fenrir
    name: Fenrir
    type: klipper
    moonraker_url: http://192.168.1.101:7125
    obs:
      scene: Printer - Fenrir

obs:
  host: 127.0.0.1
  port: 4455
  password_env: OBS_WEBSOCKET_PASSWORD
  scene_collection: null
  profile: null
  reconnect_interval: 5
  status_poll_interval: 15
  auto_launch: false
  executable: null
  launch_args: []
  process_check_interval: 5
  launch_cooldown: 30
  preflight_enabled: true
  preflight_interval: 30
  startup_ready_timeout: 45
  reconnect_stuck_seconds: 90
  stream_recovery_enabled: true
  stream_recovery_cooldown: 300
  restart_obs_on_stream_failure: false
  restart_obs_cooldown: 600

director:
  enabled: true
  rotation_interval: 30
  idle_scene: PrintDirector Idle
  overview_scene: Print Farm Overview
  auto_start_stream: false
  auto_stop_stream: false
  stream_stop_delay: 300
  near_complete_threshold: 0.95
  event_hold_times:
    print_started: 30
    print_completed: 45
    print_near_complete: 60
    printer_error: 120
    print_paused: 30

monitoring:
  stale_after_seconds: 30
  stale_check_interval: 5
  history_limit: 100

notifications:
  enabled: false
  webhook_url: null
  timeout: 5
  events:
    - printer_error
    - printer_offline
    - print_completed
    - telemetry_stale
    - all_printers_unavailable
    - obs_unavailable
    - obs_restarted
    - stream_recovery_failed

overlay:
  host: 127.0.0.1
  port: 8765
  allow_lan: false
  settings_file: overlay-settings.json
  style:
    theme: dark
    background_color: "#0b0e14"
    text_color: "#f5f7fa"
    accent_color: "#38bdf8"
    panel_opacity: 0.92
    font_scale: 1.0
    show_filename: true
    show_state: true
    show_eta: true
    show_temps: true
    show_layers: true
    printer_overrides: {}
auth:
  enabled: false
  token_env: PRINTDIRECTOR_TOKEN
logging:
  level: INFO
  file: logs/printdirector.log
  max_bytes: 10485760
  backup_count: 5
  console: true
