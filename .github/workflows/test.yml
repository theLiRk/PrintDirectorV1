name: Test PrintDirector

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q printdirector tests
      - run: node --check printdirector/overlay/static/overlay.js
      - run: node --check printdirector/overlay/static/dashboard.js
      - run: node --check printdirector/overlay/static/admin.js
      - run: node --check printdirector/overlay/static/operations.js
      - run: python -m pytest -q
